services:
  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sport_app
      DB_USERNAME: sport_app
      DB_PASSWORD: sport_app_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [sport]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    depends_on: [app]
    networks: [sport]

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
    networks: [sport]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sport_app
      MYSQL_USER: sport_app
      MYSQL_PASSWORD: sport_app_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [sport]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sport]

  queue:
    build:
      context: .
      target: development
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file: .env
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sport_app
      DB_USERNAME: sport_app
      DB_PASSWORD: sport_app_password
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [sport]

  reverb:
    build:
      context: .
      target: development
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: .env
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sport_app
      DB_USERNAME: sport_app
      DB_PASSWORD: sport_app_password
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [sport]

volumes:
  mysql-data:
  redis-data:
  app-storage:
  vendor-data:
  node-modules:

networks:
  sport:
    driver: bridge
