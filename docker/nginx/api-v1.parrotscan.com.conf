# Nginx virtual host for Sport App v1 (api-v1.parrotscan.com)
#
# INSTALL LOCATION ON VPS (do NOT overwrite any existing file):
#   sudo cp docker/nginx/api-v1.parrotscan.com.conf /etc/nginx/sites-available/api-v1.parrotscan.com
#   sudo ln -s /etc/nginx/sites-available/api-v1.parrotscan.com /etc/nginx/sites-enabled/
#
# VALIDATE BEFORE RELOADING:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# NOTES:
# - Cloudflare proxy is enabled; Cloudflare connects to this server over HTTPS.
#   If you do not have a real certificate for api-v1.parrotscan.com yet, use
#   certbot BEFORE enabling this vhost, or temporarily accept the Cloudflare
#   "Full (strict)" requirement by issuing a cert first.
# - The Docker Nginx for this project listens ONLY on 127.0.0.1:8088.

server {
    listen 80;
    server_name api-v1.parrotscan.com;

    # Allow only Cloudflare to reach this vhost on port 80 when proxy is enabled
    # (uncomment the allow/deny lines below and populate with current Cloudflare
    # IP ranges from https://www.cloudflare.com/ips/ if you want IP lockdown).
    # Cloudflare also sets CF-Connecting-IP for real client IPs (handled below).

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WebSocket / Reverb support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 75s;

        # Buffering off for streaming/WebSocket endpoints
        proxy_buffering off;
    }
}

