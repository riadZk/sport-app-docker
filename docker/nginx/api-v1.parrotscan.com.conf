# Nginx virtual host for Sport App v1 (api-v1.parrotscan.com)
#
# INSTALL LOCATION ON VPS (do NOT overwrite any existing file):
#   sudo cp docker/nginx/api-v1.parrotscan.com.conf /etc/nginx/sites-available/api-v1.parrotscan.com
#   sudo ln -s /etc/nginx/sites-available/api-v1.parrotscan.com /etc/nginx/sites-enabled/
#
# VALIDATE BEFORE RELOADING:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# NOTES:
# - Cloudflare proxy is enabled; Cloudflare connects to this server over HTTPS
#   on port 443. Port 80 redirects all traffic to HTTPS.
# - The Docker Nginx for this project listens ONLY on 127.0.0.1:8088.
# - Reverb / WebSocket proxying is removed — Reverb is disabled for V1.
# - Certificate obtained via: sudo certbot certonly --nginx -d api-v1.parrotscan.com

# HTTP — redirect all traffic to HTTPS
server {
    listen 80;
    server_name api-v1.parrotscan.com;

    return 301 https://$server_name$request_uri;
}

# HTTPS — reverse proxy to Docker Nginx on 127.0.0.1:8088
server {
    listen 443 ssl http2;
    server_name api-v1.parrotscan.com;

    ssl_certificate     /etc/letsencrypt/live/api-v1.parrotscan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-v1.parrotscan.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
